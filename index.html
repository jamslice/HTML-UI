<!DOCTYPE html>
<html lang="en">

<!--
  ============================================================
  BUDGET WALLET
  A simple app to track your money in and money out.

  HOW THIS FILE IS ORGANIZED
    1. <head>   -> page settings + CSS (the design / looks)
    2. <body>   -> HTML (the parts you see on the page)
    3. <script> -> JavaScript (what happens when you click)

  Your entries are saved in your browser, so they are still
  there when you refresh the page.
  ============================================================
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2FF6A">
  <title>Budget Wallet</title>

  <style>
    /* ==========================================================
       CSS = the design. Each block looks like:
           .thing { property: value; }
       ========================================================== */


    /* ---------- 1. COLORS AND SIZES (change these to restyle the app) ---------- */
    :root {
      --bg: #F2FF6A;        /* page background (yellow-green) */
      --ink: #14263a;       /* main text color (dark blue)    */
      --muted: #5d6f80;     /* softer gray text               */
      --line: #e3e9ee;      /* thin divider lines             */
      --surface: #ffffff;   /* white cards                    */
      --soft: #f3f6f8;      /* light gray backgrounds         */
      --in: #1f8a5b;        /* green = money in               */
      --out: #c93a3a;       /* red = money out                */
      --brand: #19AA19;     /* green for the Save button      */
      --radius: 22px;       /* how round the corners are      */
    }


    /* ---------- 2. BASIC PAGE SETUP ---------- */
    * {
      box-sizing: border-box;   /* makes sizing easier to predict */
    }

    html, body {
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;

      /* Keeps content away from phone notches and edges */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* The main container: centered, with a maximum width */
    .app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }


    /* ---------- 3. HEADER (title + peso circle) ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 1.3rem;
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;          /* 50% makes it a circle */
      background: var(--ink);
      color: var(--bg);
      display: grid;
      place-items: center;         /* centers the ₱ symbol */
      font-weight: 800;
    }


    /* ---------- 4. PAGE LAYOUT ----------
       Phone: everything stacked in one column.
       Wide screen (820px+): two columns side by side. */
    .layout {
      display: grid;
      gap: 18px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 820px) {
      .layout {
        grid-template-columns: 420px 1fr;   /* left column fixed, right column fills the rest */
        align-items: start;
      }

      .left {
        position: sticky;   /* the left side stays in view while you scroll */
        top: 24px;
      }
    }


    /* ---------- 5. WALLET CARD (the big balance card) ---------- */
    .wallet {
      position: relative;
      overflow: hidden;
      color: #fff;
      border-radius: var(--radius);
      padding: 22px 22px 20px;
      min-height: 210px;
      background: linear-gradient(135deg, #14263a 0%, #1d3d5c 55%, #19AA19 160%);
      box-shadow: 0 18px 40px -16px rgba(20, 38, 58, 0.55);

      /* Stack the inside parts vertically with space between */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    /* Two decorative circles in the background of the card */
    .wallet::before,
    .wallet::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;   /* clicks pass through them */
    }

    .wallet::before {
      width: 240px;
      height: 240px;
      right: -90px;
      top: -100px;
      background: rgba(242, 255, 106, 0.14);
    }

    .wallet::after {
      width: 180px;
      height: 180px;
      right: -30px;
      bottom: -110px;
      background: rgba(255, 255, 255, 0.07);
    }

    /* Top row: "Available balance" label + gold chip */
    .w-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;   /* keeps text above the decorative circles */
    }

    .w-label {
      font-size: 0.85rem;
      opacity: 0.75;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .chip {
      width: 38px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #f6e27a, #c9a93a);
    }

    /* The big balance number */
    .total {
      font-size: clamp(2.2rem, 9vw, 2.9rem);   /* grows/shrinks with screen size */
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 2px 0 0;
      position: relative;
      z-index: 1;
      word-break: break-all;
    }

    /* Bottom row: "Money in" and "Money out" boxes */
    .w-row {
      display: flex;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .pill {
      flex: 1;   /* both boxes share the space equally */
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      border-radius: 14px;
      padding: 9px 12px;
    }

    .pill small {
      display: block;
      opacity: 0.75;
      font-size: 0.75rem;
    }

    .pill strong {
      font-size: 1.02rem;
    }

    .pill .up   { color: #8ff0b8; }   /* money in  = light green */
    .pill .down { color: #ffb0b0; }   /* money out = light red   */


    /* ---------- 6. WHITE CARDS (form + activity list) ---------- */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      margin-top: 16px;
      box-shadow: 0 8px 24px -14px rgba(20, 38, 58, 0.25);
    }

    .right .card {
      margin-top: 0;
    }

    h2 {
      font-size: 1.05rem;
      margin: 0 0 14px;
    }


    /* ---------- 7. THE "ADD ENTRY" FORM ---------- */

    /* Expense / Income toggle buttons */
    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;   /* two equal buttons */
      background: var(--soft);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 12px;
    }

    .seg button {
      border: 0;
      background: transparent;
      font: inherit;
      font-weight: 700;
      padding: 10px;
      border-radius: 11px;
      color: var(--muted);
      cursor: pointer;
    }

    /* The currently selected button turns white and colored */
    .seg button.active.expense {
      background: #fff;
      color: var(--out);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .seg button.active.income {
      background: #fff;
      color: var(--in);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      font: inherit;
      color: var(--ink);
      padding: 12px 14px;
      margin-top: 5px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    /* Green glow when you click inside a box */
    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(25, 170, 25, 0.15);
    }

    /* Red border when the amount is invalid (class "err" is added by JavaScript) */
    input.err {
      border-color: var(--out);
    }

    /* The green Save button */
    .save {
      width: 100%;
      font: inherit;
      font-weight: 800;
      padding: 14px;
      border: 0;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      transition: transform 0.08s, filter 0.15s;
    }

    .save:hover  { filter: brightness(1.07); }   /* slightly brighter on hover */
    .save:active { transform: scale(0.98); }     /* tiny "press" effect        */


    /* ---------- 8. RECENT ACTIVITY LIST ---------- */
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    /* One row in the list */
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }

    li:first-child {
      border-top: 0;   /* no line above the first row */
    }

    /* The emoji icon box */
    .ico {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      flex: none;
    }

    .ico.income  { background: #e3f6ec; }
    .ico.expense { background: #fbeaea; }

    /* Name + "Income"/"Expense" label */
    .name {
      flex: 1;       /* takes all the leftover space */
      min-width: 0;
    }

    .name b {
      display: block;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;   /* long names end with "..." */
      white-space: nowrap;
    }

    .name small {
      color: var(--muted);
    }

    /* The amount on the right side */
    .amt {
      font-weight: 800;
      white-space: nowrap;
    }

    .amt.income  { color: var(--in); }
    .amt.expense { color: var(--out); }

    /* The small ✕ delete button */
    button.del {
      width: 32px;
      height: 32px;
      flex: none;
      border: 0;
      border-radius: 10px;
      background: var(--soft);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
    }

    button.del:hover {
      background: #fbe9e9;
      color: var(--out);
    }

    /* Message shown when there are no entries */
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 24px 0;
    }

    /* On wide screens, the list scrolls instead of growing forever */
    .list-wrap {
      max-height: none;
    }

    @media (min-width: 820px) {
      .list-wrap {
        max-height: 70vh;
        overflow-y: auto;
        padding-right: 4px;
      }
    }
  </style>
</head>


<body>
  <!-- ==========================================================
       HTML = the parts you can see on the page.
       Items with an id="..." are the ones JavaScript changes later.
       ========================================================== -->

  <main class="app">

    <!-- Top bar: app title and the ₱ circle -->
    <header>
      <h1>Budget Wallet</h1>
      <div class="avatar" aria-hidden="true">₱</div>
    </header>

    <div class="layout">

      <!-- LEFT SIDE: balance card + add-entry form -->
      <div class="left">

        <!-- Balance card -->
        <section class="wallet" aria-label="Balance">
          <div class="w-top">
            <span class="w-label">Available balance</span>
            <span class="chip"></span>
          </div>

          <!-- JavaScript fills these three numbers in -->
          <p class="total" id="balance">₱0</p>

          <div class="w-row">
            <div class="pill">
              <small>↓ Money in</small>
              <strong class="up" id="moneyIn">₱0</strong>
            </div>
            <div class="pill">
              <small>↑ Money out</small>
              <strong class="down" id="moneyOut">₱0</strong>
            </div>
          </div>
        </section>

        <!-- Add-entry form -->
        <section class="card">
          <h2>Add entry</h2>

          <!-- Expense / Income toggle -->
          <div class="seg" role="group" aria-label="Type">
            <button type="button" class="expense active" data-type="expense">Expense</button>
            <button type="button" class="income" data-type="income">Income</button>
          </div>

          <label>What for
            <input type="text" id="desc" placeholder="Lunch, jeep fare" autocomplete="off">
          </label>

          <label>Amount (₱)
            <input type="number" id="amount" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
          </label>

          <button type="button" class="save" id="saveBtn">Save entry</button>
        </section>
      </div>

      <!-- RIGHT SIDE: list of recent entries -->
      <section class="card right">
        <h2>Recent activity</h2>
        <div class="list-wrap">
          <!-- JavaScript builds the list items here -->
          <ul id="list"></ul>
        </div>
      </section>

    </div>
  </main>


  <script>
    /* ==========================================================
       JAVASCRIPT = what the app DOES.

       The big idea:
         - "entries" is a list holding all your money records.
         - When it changes, we save it and redraw the screen.

       Each entry looks like this:
         { desc: "Lunch", amount: 120, type: "expense" }
       ========================================================== */


    /* ---------- 1. SETTINGS AND STARTING DATA ---------- */

    // The name used to save your data inside the browser
    const STORAGE_KEY = "budgetEntries";

    // Example entries shown the very first time you open the app
    const STARTER_ENTRIES = [
      { desc: "Starting money in",  amount: 19500, type: "income"  },
      { desc: "Starting money out", amount: 15892, type: "expense" },
      { desc: "Freelance payment",  amount: 4500,  type: "income"  },
      { desc: "Jeep fare",          amount: 68,    type: "expense" },
      { desc: "Lunch",              amount: 120,   type: "expense" }
    ];


    /* ---------- 2. LOAD SAVED DATA ---------- */

    let entries;   // the list of all entries

    try {
      // Try to read previously saved entries from the browser
      entries = JSON.parse(localStorage.getItem(STORAGE_KEY));
    } catch (error) {
      // If reading fails, do nothing (we handle it on the next line)
    }

    // If nothing valid was saved, use the starter entries instead
    if (!Array.isArray(entries)) {
      entries = STARTER_ENTRIES;
    }

    // Which toggle is selected right now: "expense" or "income"
    let currentType = "expense";


    /* ---------- 3. SMALL HELPER FUNCTIONS ---------- */

    // Shortcut: getEl("balance") is the same as document.getElementById("balance")
    function getEl(id) {
      return document.getElementById(id);
    }

    // Turns 1500 into "₱1,500"
    function formatPeso(number) {
      return "₱" + number.toLocaleString("en-PH", { maximumFractionDigits: 2 });
    }

    // Saves the entries list into the browser
    function saveEntries() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      } catch (error) {
        // If saving fails (e.g. private mode), the app still works, just won't remember.
      }
    }

    // Adds up all entries of one type ("income" or "expense")
    function totalOf(type) {
      return entries
        .filter(entry => entry.type === type)           // keep only that type
        .reduce((sum, entry) => sum + entry.amount, 0); // add the amounts together
    }

    // Picks an emoji by looking for keywords in the description
    function pickIcon(entry) {
      const text = entry.desc.toLowerCase();

      if (/jeep|fare|bus|grab|taxi|mrt|lrt|gas|fuel|ride/.test(text))  return "🚌";
      if (/lunch|dinner|breakfast|food|meal|snack|coffee|eat/.test(text)) return "🍔";
      if (/load|bill|wifi|internet|electric|water|rent/.test(text))    return "🧾";
      if (/freelance|salary|pay|allowance|gift/.test(text))            return "💼";

      // No keyword matched, so use a default icon
      return entry.type === "income" ? "⬇️" : "🛍️";
    }


    /* ---------- 4. DRAWING THE SCREEN ---------- */

    // Updates the three numbers on the wallet card
    function showBalance() {
      const moneyIn  = totalOf("income");
      const moneyOut = totalOf("expense");
      const balance  = moneyIn - moneyOut;

      getEl("moneyIn").textContent  = formatPeso(moneyIn);
      getEl("moneyOut").textContent = formatPeso(moneyOut);

      // Show a minus sign if you are below zero
      const sign = balance < 0 ? "−" : "";
      getEl("balance").textContent = sign + formatPeso(Math.abs(balance));
    }

    // Builds ONE row of the activity list.
    // "index" is the entry's position in the list, so delete knows which one to remove.
    function buildListRow(entry, index) {
      const row = document.createElement("li");

      // Emoji icon
      const icon = document.createElement("div");
      icon.className = "ico " + entry.type;
      icon.textContent = pickIcon(entry);

      // Name and "Income"/"Expense" label
      const nameBox = document.createElement("div");
      nameBox.className = "name";

      const title = document.createElement("b");
      title.textContent = entry.desc;

      const subtitle = document.createElement("small");
      subtitle.textContent = entry.type === "income" ? "Income" : "Expense";

      nameBox.append(title, subtitle);

      // Amount with + or − in front
      const amount = document.createElement("span");
      amount.className = "amt " + entry.type;
      const sign = entry.type === "income" ? "+" : "−";
      amount.textContent = sign + formatPeso(entry.amount);

      // Delete button
      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "del";
      deleteBtn.setAttribute("aria-label", "Delete " + entry.desc);
      deleteBtn.textContent = "✕";

      deleteBtn.addEventListener("click", () => {
        entries.splice(index, 1);   // remove 1 item at this position
        saveEntries();
        render();
      });

      row.append(icon, nameBox, amount, deleteBtn);
      return row;
    }

    // Redraws the activity list
    function showList() {
      const list = getEl("list");
      list.innerHTML = "";   // clear the old list first

      // If there are no entries, show a friendly message
      if (entries.length === 0) {
        list.innerHTML = '<li class="empty">No entries yet. Add your first one!</li>';
        return;
      }

      // Remember each entry's original position, keep only the latest 20,
      // then flip the order so the newest is on top.
      const latestEntries = entries
        .map((entry, index) => ({ entry, index }))
        .slice(-20)
        .reverse();

      latestEntries.forEach(item => {
        list.appendChild(buildListRow(item.entry, item.index));
      });
    }

    // Redraws EVERYTHING. Call this whenever the data changes.
    function render() {
      showBalance();
      showList();
    }


    /* ---------- 5. ADDING A NEW ENTRY ---------- */

    function addEntry() {
      const descInput   = getEl("desc");
      const amountInput = getEl("amount");

      // If the description is empty, use "Income" or "Expense" as a default
      const defaultName = currentType === "income" ? "Income" : "Expense";
      const desc = descInput.value.trim() || defaultName;

      const amount = parseFloat(amountInput.value);

      // The amount must be a number bigger than 0, otherwise show the red error border
      if (isNaN(amount) || amount <= 0) {
        amountInput.classList.add("err");
        amountInput.focus();
        return;   // stop here, don't save
      }

      amountInput.classList.remove("err");

      // Add the new entry to the list, save it, and redraw the screen
      entries.push({ desc: desc, amount: amount, type: currentType });
      saveEntries();
      render();

      // Clear the form so you can type the next entry
      descInput.value = "";
      amountInput.value = "";
    }


    /* ---------- 6. CONNECTING BUTTONS TO FUNCTIONS ---------- */

    // Expense / Income toggle: remember which one is picked and highlight it
    document.querySelectorAll(".seg button").forEach(button => {
      button.addEventListener("click", () => {
        currentType = button.dataset.type;   // reads data-type="..." from the HTML

        document.querySelectorAll(".seg button").forEach(other => {
          other.classList.toggle("active", other === button);
        });
      });
    });

    // Clicking "Save entry"
    getEl("saveBtn").addEventListener("click", addEntry);

    // Pressing Enter inside the amount box also saves
    getEl("amount").addEventListener("keydown", event => {
      if (event.key === "Enter") addEntry();
    });

    // Typing in the amount box removes the red error border
    getEl("amount").addEventListener("input", () => {
      getEl("amount").classList.remove("err");
    });


    /* ---------- 7. START THE APP ---------- */
    render();   // draw everything once when the page opens
  </script>
</body>
</html>
