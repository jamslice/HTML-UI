<!DOCTYPE html>
<html lang="en">

<!--
  Budget Wallet
  Track the money coming in and going out.

  Everything lives in this one file:
    - the <style> part is how it looks
    - the <body> part is what's on the page
    - the <script> part is how it works

  Entries get saved in your browser, so they're still
  there after you refresh.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2FF6A">
  <title>Budget Wallet</title>

  <style>
    /* ---------- Colors and sizes ----------
       Want a different vibe? Change these and refresh. */
    :root {
      --bg: #F2FF6A;        /* page background */
      --ink: #14263a;       /* main text */
      --muted: #5d6f80;     /* softer gray text */
      --line: #e3e9ee;      /* thin divider lines */
      --surface: #ffffff;   /* white cards */
      --soft: #f3f6f8;      /* light gray patches */
      --in: #1f8a5b;       /* green for money in */
      --out: #c93a3a;       /* red for money out */
      --brand: #19AA19;     /* the Save button green */
      --radius: 22px;       /* how round the corners are */
    }


    /* ---------- Page basics ---------- */
    * {
      box-sizing: border-box;   /* so padding doesn't mess up widths */
    }

    html, body {
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;

      /* keeps stuff away from phone notches */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* the main box, centered with a max width */
    .app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }


    /* ---------- Header ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 1.3rem;
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    /* the little ₱ circle */
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--bg);
      display: grid;
      place-items: center;
      font-weight: 800;
    }


    /* ---------- Layout ----------
       On phones everything stacks in one column.
       On wider screens we split it into two. */
    .layout {
      display: grid;
      gap: 18px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 820px) {
      .layout {
        grid-template-columns: 420px 1fr;
        align-items: start;
      }

      /* left side stays put while the list scrolls */
      .left {
        position: sticky;
        top: 24px;
      }
    }


    /* ---------- The wallet card ---------- */
    .wallet {
      position: relative;
      overflow: hidden;
      color: #fff;
      border-radius: var(--radius);
      padding: 22px 22px 20px;
      min-height: 210px;
      background: linear-gradient(135deg, #14263a 0%, #1d3d5c 55%, #19AA19 160%);
      box-shadow: 0 18px 40px -16px rgba(20, 38, 58, 0.55);

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    /* two faint circles for decoration */
    .wallet::before,
    .wallet::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;   /* so they don't block clicks */
    }

    .wallet::before {
      width: 240px;
      height: 240px;
      right: -90px;
      top: -100px;
      background: rgba(242, 255, 106, 0.14);
    }

    .wallet::after {
      width: 180px;
      height: 180px;
      right: -30px;
      bottom: -110px;
      background: rgba(255, 255, 255, 0.07);
    }

    /* top row: label on the left, gold chip on the right */
    .w-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;   /* keeps it above the decorative circles */
    }

    .w-label {
      font-size: 0.85rem;
      opacity: 0.75;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .chip {
      width: 38px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #f6e27a, #c9a93a);
    }

    /* the big balance number */
    .total {
      font-size: clamp(2.2rem, 9vw, 2.9rem);   /* shrinks on small screens */
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 2px 0 0;
      position: relative;
      z-index: 1;
      word-break: break-all;
    }

    /* the money in / money out boxes */
    .w-row {
      display: flex;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .pill {
      flex: 1;   /* both boxes get equal space */
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      border-radius: 14px;
      padding: 9px 12px;
    }

    .pill small {
      display: block;
      opacity: 0.75;
      font-size: 0.75rem;
    }

    .pill strong {
      font-size: 1.02rem;
    }

    .pill .up   { color: #8ff0b8; }
    .pill .down { color: #ffb0b0; }


    /* ---------- White cards (form + list) ---------- */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      margin-top: 16px;
      box-shadow: 0 8px 24px -14px rgba(20, 38, 58, 0.25);
    }

    .right .card {
      margin-top: 0;
    }

    h2 {
      font-size: 1.05rem;
      margin: 0 0 14px;
    }


    /* ---------- The add-entry form ---------- */

    /* the Expense / Income switch */
    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--soft);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 12px;
    }

    .seg button {
      border: 0;
      background: transparent;
      font: inherit;
      font-weight: 700;
      padding: 10px;
      border-radius: 11px;
      color: var(--muted);
      cursor: pointer;
    }

    /* whichever one is picked turns white with its color */
    .seg button.active.expense {
      background: #fff;
      color: var(--out);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .seg button.active.income {
      background: #fff;
      color: var(--in);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      font: inherit;
      color: var(--ink);
      padding: 12px 14px;
      margin-top: 5px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    /* green glow when you click into a box */
    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(25, 170, 25, 0.15);
    }

    /* red border when the amount is wrong (the script adds "err") */
    input.err {
      border-color: var(--out);
    }

    .save {
      width: 100%;
      font: inherit;
      font-weight: 800;
      padding: 14px;
      border: 0;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      transition: transform 0.08s, filter 0.15s;
    }

    .save:hover  { filter: brightness(1.07); }   /* a bit brighter */
    .save:active { transform: scale(0.98); }     /* tiny press effect */


    /* ---------- Recent activity list ---------- */
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }

    li:first-child {
      border-top: 0;   /* no line above the very first one */
    }

    /* emoji box */
    .ico {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      flex: none;
    }

    .ico.income  { background: #e3f6ec; }
    .ico.expense { background: #fbeaea; }

    /* the name + "Income"/"Expense" text */
    .name {
      flex: 1;   /* grabs all the leftover space */
      min-width: 0;
    }

    .name b {
      display: block;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;   /* long names get "..." */
      white-space: nowrap;
    }

    .name small {
      color: var(--muted);
    }

    .amt {
      font-weight: 800;
      white-space: nowrap;
    }

    .amt.income  { color: var(--in); }
    .amt.expense { color: var(--out); }

    /* the little ✕ button */
    button.del {
      width: 32px;
      height: 32px;
      flex: none;
      border: 0;
      border-radius: 10px;
      background: var(--soft);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
    }

    button.del:hover {
      background: #fbe9e9;
      color: var(--out);
    }

    /* shown when the list is empty */
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 24px 0;
    }

    .list-wrap {
      max-height: none;
    }

    /* on big screens, let the list scroll instead of growing forever */
    @media (min-width: 820px) {
      .list-wrap {
        max-height: 70vh;
        overflow-y: auto;
        padding-right: 4px;
      }
    }
  </style>
</head>


<body>
  <!-- Anything with an id="..." is something the script updates later -->

  <main class="app">

    <header>
      <h1>Budget Wallet</h1>
      <div class="avatar" aria-hidden="true">₱</div>
    </header>

    <div class="layout">

      <!-- left side: the balance card and the form -->
      <div class="left">

        <section class="wallet" aria-label="Balance">
          <div class="w-top">
            <span class="w-label">Available balance</span>
            <span class="chip"></span>
          </div>

          <!-- these three numbers get filled in by the script -->
          <p class="total" id="balance">₱0</p>

          <div class="w-row">
            <div class="pill">
              <small>↓ Money in</small>
              <strong class="up" id="moneyIn">₱0</strong>
            </div>
            <div class="pill">
              <small>↑ Money out</small>
              <strong class="down" id="moneyOut">₱0</strong>
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Add entry</h2>

          <!-- pick Expense or Income -->
          <div class="seg" role="group" aria-label="Type">
            <button type="button" class="expense active" data-type="expense">Expense</button>
            <button type="button" class="income" data-type="income">Income</button>
          </div>

          <label>What for
            <input type="text" id="desc" placeholder="Lunch, jeep fare" autocomplete="off">
          </label>

          <label>Amount (₱)
            <input type="number" id="amount" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
          </label>

          <button type="button" class="save" id="saveBtn">Save entry</button>
        </section>
      </div>

      <!-- right side: the list of entries -->
      <section class="card right">
        <h2>Recent activity</h2>
        <div class="list-wrap">
          <!-- the script builds the rows in here -->
          <ul id="list"></ul>
        </div>
      </section>

    </div>
  </main>


  <script>
    /* How this works, quick version:
       - "entries" is a list of everything you've added
       - whenever it changes, we save it and redraw the screen

       One entry looks like this:
       { desc: "Lunch", amount: 120, type: "expense" } */


    /* ---------- Settings and starter data ---------- */

    // the name we save your data under in the browser
    const STORAGE_KEY = "budgetEntries";

    // what you see the very first time you open the app
    const STARTER_ENTRIES = [
      { desc: "Starting money in",  amount: 19500, type: "income"  },
      { desc: "Starting money out", amount: 15892, type: "expense" },
      { desc: "Freelance payment",  amount: 4500,  type: "income"  },
      { desc: "Jeep fare",          amount: 68,    type: "expense" },
      { desc: "Lunch",              amount: 120,   type: "expense" }
    ];


    /* ---------- Loading saved data ---------- */

    let entries;

    try {
      // see if there's anything saved from last time
      entries = JSON.parse(localStorage.getItem(STORAGE_KEY));
    } catch (error) {
      // couldn't read it, no worries, the next bit handles that
    }

    // nothing saved (or it's broken)? use the starter entries
    if (!Array.isArray(entries)) {
      entries = STARTER_ENTRIES;
    }

    // which button is selected right now
    let currentType = "expense";


    /* ---------- Little helpers ---------- */

    // shortcut so we don't type document.getElementById every time
    function getEl(id) {
      return document.getElementById(id);
    }

    // 1500 becomes "₱1,500"
    function formatPeso(number) {
      return "₱" + number.toLocaleString("en-PH", { maximumFractionDigits: 2 });
    }

    // saves your entries in the browser
    function saveEntries() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      } catch (error) {
        // saving can fail in private mode; the app still works, it just won't remember
      }
    }

    // adds up every entry of one type ("income" or "expense")
    function totalOf(type) {
      return entries
        .filter(entry => entry.type === type)            // only that type
        .reduce((sum, entry) => sum + entry.amount, 0);  // then add them up
    }

    // picks an emoji based on words in the description
    function pickIcon(entry) {
      const text = entry.desc.toLowerCase();

      if (/jeep|fare|bus|grab|taxi|mrt|lrt|gas|fuel|ride/.test(text))     return "🚌";
      if (/lunch|dinner|breakfast|food|meal|snack|coffee|eat/.test(text)) return "🍔";
      if (/load|bill|wifi|internet|electric|water|rent/.test(text))       return "🧾";
      if (/freelance|salary|pay|allowance|gift/.test(text))               return "💼";

      // nothing matched, so give it a default icon
      return entry.type === "income" ? "⬇️" : "🛍️";
    }


    /* ---------- Drawing the screen ---------- */

    // updates the numbers on the wallet card
    function showBalance() {
      const moneyIn  = totalOf("income");
      const moneyOut = totalOf("expense");
      const balance  = moneyIn - moneyOut;

      getEl("moneyIn").textContent  = formatPeso(moneyIn);
      getEl("moneyOut").textContent = formatPeso(moneyOut);

      // put a minus in front if you've gone below zero
      const sign = balance < 0 ? "−" : "";
      getEl("balance").textContent = sign + formatPeso(Math.abs(balance));
    }

    // builds one row of the list.
    // "index" is its spot in the entries list, so delete knows which one to remove
    function buildListRow(entry, index) {
      const row = document.createElement("li");

      // emoji
      const icon = document.createElement("div");
      icon.className = "ico " + entry.type;
      icon.textContent = pickIcon(entry);

      // name + small "Income"/"Expense" label under it
      const nameBox = document.createElement("div");
      nameBox.className = "name";

      const title = document.createElement("b");
      title.textContent = entry.desc;

      const subtitle = document.createElement("small");
      subtitle.textContent = entry.type === "income" ? "Income" : "Expense";

      nameBox.append(title, subtitle);

      // amount, with a + or − in front
      const amount = document.createElement("span");
      amount.className = "amt " + entry.type;
      const sign = entry.type === "income" ? "+" : "−";
      amount.textContent = sign + formatPeso(entry.amount);

      // the ✕ button
      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "del";
      deleteBtn.setAttribute("aria-label", "Delete " + entry.desc);
      deleteBtn.textContent = "✕";

      deleteBtn.addEventListener("click", () => {
        entries.splice(index, 1);   // take this one out of the list
        saveEntries();
        render();
      });

      row.append(icon, nameBox, amount, deleteBtn);
      return row;
    }

    // redraws the whole list
    function showList() {
      const list = getEl("list");
      list.innerHTML = "";   // wipe the old rows first

      // no entries? show a friendly message instead
      if (entries.length === 0) {
        list.innerHTML = '<li class="empty">No entries yet. Add your first one!</li>';
        return;
      }

      // keep track of each entry's spot, take the latest 20,
      // and flip them so the newest shows up on top
      const latestEntries = entries
        .map((entry, index) => ({ entry, index }))
        .slice(-20)
        .reverse();

      latestEntries.forEach(item => {
        list.appendChild(buildListRow(item.entry, item.index));
      });
    }

    // redraws everything. we call this any time the data changes
    function render() {
      showBalance();
      showList();
    }


    /* ---------- Adding a new entry ---------- */

    function addEntry() {
      const descInput   = getEl("desc");
      const amountInput = getEl("amount");

      // left the description empty? just call it "Income" or "Expense"
      const defaultName = currentType === "income" ? "Income" : "Expense";
      const desc = descInput.value.trim() || defaultName;

      const amount = parseFloat(amountInput.value);

      // amount has to be a real number above 0, otherwise flash the red border
      if (isNaN(amount) || amount <= 0) {
        amountInput.classList.add("err");
        amountInput.focus();
        return;   // stop here, nothing gets saved
      }

      amountInput.classList.remove("err");

      // add it, save it, redraw
      entries.push({ desc: desc, amount: amount, type: currentType });
      saveEntries();
      render();

      // clear the form for the next one
      descInput.value = "";
      amountInput.value = "";
    }


    /* ---------- Hooking up the buttons ---------- */

    // Expense / Income switch: remember which one you picked and highlight it
    document.querySelectorAll(".seg button").forEach(button => {
      button.addEventListener("click", () => {
        currentType = button.dataset.type;   // reads the data-type from the HTML

        document.querySelectorAll(".seg button").forEach(other => {
          other.classList.toggle("active", other === button);
        });
      });
    });

    // clicking Save
    getEl("saveBtn").addEventListener("click", addEntry);

    // pressing Enter in the amount box saves too
    getEl("amount").addEventListener("keydown", event => {
      if (event.key === "Enter") addEntry();
    });

    // start typing again and the red border goes away
    getEl("amount").addEventListener("input", () => {
      getEl("amount").classList.remove("err");
    });


    /* ---------- Go! ---------- */
    render();   // draw everything once when the page opens
  </script>
</body>
</html>
