<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2FF6A">
<title>Budget Wallet</title>
<style>
  :root{
    --bg:#F2FF6A; --ink:#14263a; --muted:#5d6f80; --line:#e3e9ee;
    --surface:#ffffff; --soft:#f3f6f8;
    --in:#1f8a5b; --out:#c93a3a; --brand:#19AA19;
    --radius:22px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app{max-width:1000px;margin:0 auto;padding:24px 16px 40px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  header h1{font-size:1.3rem;margin:0;font-weight:800;letter-spacing:-.01em}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);
    display:grid;place-items:center;font-weight:800}

  .layout{display:grid;gap:18px;grid-template-columns:1fr}
  @media (min-width:820px){
    .layout{grid-template-columns:420px 1fr;align-items:start}
    .left{position:sticky;top:24px}
  }

  /* Wallet card */
  .wallet{
    position:relative;overflow:hidden;color:#fff;border-radius:var(--radius);
    padding:22px 22px 20px;min-height:210px;
    background:linear-gradient(135deg,#14263a 0%,#1d3d5c 55%,#19AA19 160%);
    box-shadow:0 18px 40px -16px rgba(20,38,58,.55);
    display:flex;flex-direction:column;justify-content:space-between;gap:18px;
  }
  .wallet::before,.wallet::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
  .wallet::before{width:240px;height:240px;right:-90px;top:-100px;background:rgba(242,255,106,.14)}
  .wallet::after{width:180px;height:180px;right:-30px;bottom:-110px;background:rgba(255,255,255,.07)}
  .w-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
  .w-label{font-size:.85rem;opacity:.75;letter-spacing:.04em;text-transform:uppercase}
  .chip{width:38px;height:28px;border-radius:7px;background:linear-gradient(135deg,#f6e27a,#c9a93a)}
  .total{font-size:clamp(2.2rem,9vw,2.9rem);font-weight:800;letter-spacing:-.02em;margin:2px 0 0;position:relative;z-index:1;word-break:break-all}
  .w-row{display:flex;gap:10px;position:relative;z-index:1}
  .pill{flex:1;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);border-radius:14px;padding:9px 12px}
  .pill small{display:block;opacity:.75;font-size:.75rem}
  .pill strong{font-size:1.02rem}
  .pill .up{color:#8ff0b8}.pill .down{color:#ffb0b0}

  .card{background:var(--surface);border-radius:var(--radius);padding:18px;margin-top:16px;
    box-shadow:0 8px 24px -14px rgba(20,38,58,.25)}
  .right .card{margin-top:0}
  h2{font-size:1.05rem;margin:0 0 14px}

  /* Form */
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:12px}
  .seg button{border:0;background:transparent;font:inherit;font-weight:700;padding:10px;border-radius:11px;color:var(--muted);cursor:pointer}
  .seg button.active.expense{background:#fff;color:var(--out);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .seg button.active.income{background:#fff;color:var(--in);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:12px}
  input{width:100%;font:inherit;color:var(--ink);padding:12px 14px;margin-top:5px;
    border:1.5px solid var(--line);border-radius:12px;background:#fff}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(25,170,25,.15)}
  input.err{border-color:var(--out)}
  .save{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;
    background:var(--brand);color:#fff;cursor:pointer;transition:transform .08s,filter .15s}
  .save:hover{filter:brightness(1.07)}.save:active{transform:scale(.98)}

  /* List */
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  li:first-child{border-top:0}
  .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;flex:none}
  .ico.income{background:#e3f6ec}.ico.expense{background:#fbeaea}
  .name{flex:1;min-width:0}
  .name b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .name small{color:var(--muted)}
  .amt{font-weight:800;white-space:nowrap}
  .amt.income{color:var(--in)}.amt.expense{color:var(--out)}
  button.del{width:32px;height:32px;flex:none;border:0;border-radius:10px;background:var(--soft);
    color:var(--muted);cursor:pointer;font-size:.8rem}
  button.del:hover{background:#fbe9e9;color:var(--out)}
  .empty{text-align:center;color:var(--muted);padding:24px 0}
  .list-wrap{max-height:none}
  @media (min-width:820px){.list-wrap{max-height:70vh;overflow-y:auto;padding-right:4px}}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Budget Wallet</h1>
    <div class="avatar" aria-hidden="true">₱</div>
  </header>

  <div class="layout">
    <div class="left">
      <section class="wallet" aria-label="Balance">
        <div class="w-top"><span class="w-label">Available balance</span><span class="chip"></span></div>
        <p class="total" id="balance">₱0</p>
        <div class="w-row">
          <div class="pill"><small>↓ Money in</small><strong class="up" id="moneyIn">₱0</strong></div>
          <div class="pill"><small>↑ Money out</small><strong class="down" id="moneyOut">₱0</strong></div>
        </div>
      </section>

      <section class="card">
        <h2>Add entry</h2>
        <div class="seg" role="group" aria-label="Type">
          <button type="button" class="expense active" data-type="expense">Expense</button>
          <button type="button" class="income" data-type="income">Income</button>
        </div>
        <label>What for <input type="text" id="desc" placeholder="Lunch, jeep fare" autocomplete="off"></label>
        <label>Amount (₱) <input type="number" id="amount" placeholder="0.00" min="0" step="0.01" inputmode="decimal"></label>
        <button type="button" class="save" id="saveBtn">Save entry</button>
      </section>
    </div>

    <section class="card right">
      <h2>Recent activity</h2>
      <div class="list-wrap"><ul id="list"></ul></div>
    </section>
  </div>
</main>

<script>
  const KEY = "budgetEntries";
  const defaults = [
    { desc: "Starting money in", amount: 19500, type: "income" },
    { desc: "Starting money out", amount: 15892, type: "expense" },
    { desc: "Freelance payment", amount: 4500, type: "income" },
    { desc: "Jeep fare", amount: 68, type: "expense" },
    { desc: "Lunch", amount: 120, type: "expense" }
  ];

  let entries;
  try { entries = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!Array.isArray(entries)) entries = defaults;

  let type = "expense";
  const $ = id => document.getElementById(id);
  const peso = n => "₱" + n.toLocaleString("en-PH", { maximumFractionDigits: 2 });

  function save() { try { localStorage.setItem(KEY, JSON.stringify(entries)); } catch (e) {} }

  function icon(e) {
    const d = e.desc.toLowerCase();
    if (/jeep|fare|bus|grab|taxi|mrt|lrt|gas|fuel|ride/.test(d)) return "🚌";
    if (/lunch|dinner|breakfast|food|meal|snack|coffee|eat/.test(d)) return "🍔";
    if (/load|bill|wifi|internet|electric|water|rent/.test(d)) return "🧾";
    if (/freelance|salary|pay|allowance|gift/.test(d)) return "💼";
    return e.type === "income" ? "⬇️" : "🛍️";
  }

  function render() {
    const sum = t => entries.filter(e => e.type === t).reduce((s, e) => s + e.amount, 0);
    const mIn = sum("income"), mOut = sum("expense");
    $("moneyIn").textContent = peso(mIn);
    $("moneyOut").textContent = peso(mOut);
    $("balance").textContent = (mIn - mOut < 0 ? "−" : "") + peso(Math.abs(mIn - mOut));

    const list = $("list");
    list.innerHTML = "";
    if (!entries.length) {
      list.innerHTML = '<li class="empty">No entries yet. Add your first one!</li>';
      return;
    }
    entries.map((e, i) => ({ e, i })).slice(-20).reverse().forEach(({ e, i }) => {
      const li = document.createElement("li");

      const ico = document.createElement("div");
      ico.className = "ico " + e.type;
      ico.textContent = icon(e);

      const name = document.createElement("div");
      name.className = "name";
      const b = document.createElement("b"); b.textContent = e.desc;
      const s = document.createElement("small"); s.textContent = e.type === "income" ? "Income" : "Expense";
      name.append(b, s);

      const amt = document.createElement("span");
      amt.className = "amt " + e.type;
      amt.textContent = (e.type === "income" ? "+" : "−") + peso(e.amount);

      const del = document.createElement("button");
      del.type = "button"; del.className = "del";
      del.setAttribute("aria-label", "Delete " + e.desc);
      del.textContent = "✕";
      del.addEventListener("click", () => { entries.splice(i, 1); save(); render(); });

      li.append(ico, name, amt, del);
      list.appendChild(li);
    });
  }

  document.querySelectorAll(".seg button").forEach(btn => {
    btn.addEventListener("click", () => {
      type = btn.dataset.type;
      document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("active", b === btn));
    });
  });

  function addEntry() {
    const descEl = $("desc"), amountEl = $("amount");
    const desc = descEl.value.trim() || (type === "income" ? "Income" : "Expense");
    const amount = parseFloat(amountEl.value);
    if (isNaN(amount) || amount <= 0) {
      amountEl.classList.add("err");
      amountEl.focus();
      return;
    }
    amountEl.classList.remove("err");
    entries.push({ desc, amount, type });
    save(); render();
    descEl.value = ""; amountEl.value = "";
  }

  $("saveBtn").addEventListener("click", addEntry);
  $("amount").addEventListener("keydown", ev => { if (ev.key === "Enter") addEntry(); });
  $("amount").addEventListener("input", () => $("amount").classList.remove("err"));

  render();
</script>
</body>
</html>
